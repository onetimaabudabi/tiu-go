  <symbol id="icon-signal-high" viewBox="0 0 24 24">
    <path d="M4 20.5v-3.2"/>
    <path d="M9.3 20.5v-6.4"/>
    <path d="M14.7 20.5v-9.6"/>
    <path d="M20 20.5V7.7"/>
