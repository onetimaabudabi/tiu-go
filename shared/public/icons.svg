  <symbol id="icon-camera" viewBox="0 0 24 24">
    <path d="M20.5 18.2a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V9.3a2 2 0 0 1 2-2h2.4l1.5-2.4h5.2l1.5 2.4h2.4a2 2 0 0 1 2 2z"/>
    <circle cx="12" cy="13.5" r="3.4"/>
