  <symbol id="icon-signal" viewBox="0 0 24 24">
    <path d="M12 20.5h.01"/>
    <path d="M8.1 16.6a5.5 5.5 0 0 1 7.8 0"/>
    <path d="M5 13.5a10 10 0 0 1 14 0"/>
    <path d="M2 10.4a14.4 14.4 0 0 1 20 0"/>
  </symbol>

  <symbol id="icon-signal-low" viewBox="0 0 24 24">
    <path d="M4 20.5v-3.2"/>
    <path d="M9.3 20.5v-6.4" opacity="0.3"/>
    <path d="M14.7 20.5v-9.6" opacity="0.3"/>
    <path d="M20 20.5V7.7" opacity="0.3"/>
  </symbol>

  <symbol id="icon-signal-medium" viewBox="0 0 24 24">
    <path d="M4 20.5v-3.2"/>
    <path d="M9.3 20.5v-6.4"/>
    <path d="M14.7 20.5v-9.6" opacity="0.3"/>
    <path d="M20 20.5V7.7" opacity="0.3"/>
